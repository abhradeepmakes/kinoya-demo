name: Rename demo file to index.html
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/rename.yml
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename file and push
        run: |
          if [ -f kinoya-demo.html ]; then
            git mv kinoya-demo.html index.html
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Rename kinoya-demo.html to index.html"
            git push
          else
            echo "kinoya-demo.html not present; nothing to do."
          fi
